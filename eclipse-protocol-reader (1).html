<!DOCTYPE html>
<html lang="en">
<head>

<title>Eclipse Protocol — Chapters 56–60</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d12;
    --bg-elevated: #10141b;
    --panel: #12161f;
    --panel-border: #232a37;
    --text: #dfe3e9;
    --text-dim: #838d9c;
    --text-faint: #545e6e;
    --cyan: #4fd6e8;
    --cyan-dim: #2b8a97;
    --cyan-glow: rgba(79, 214, 232, 0.16);
    --gold: #d9a94f;
    --gold-glow: rgba(217, 169, 79, 0.14);
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
    --max-w: 640px;
    --rail-w: 280px;
  }

  [data-theme="sepia"]{
    --bg: #f1ead9;
    --bg-elevated: #e9dfc9;
    --panel: #e9dfc9;
    --panel-border: #d3c5a5;
    --text: #33291b;
    --text-dim: #6b5c42;
    --text-faint: #948564;
    --cyan: #0f7a8a;
    --cyan-dim: #0f7a8a;
    --cyan-glow: rgba(15, 122, 138, 0.10);
    --gold: #9a6a1f;
    --gold-glow: rgba(154, 106, 31, 0.12);
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    transition: background 0.25s ease, color 0.25s ease;
    min-height: 100vh;
  }

  /* faint scanline texture across the whole app, very subtle */
  body::before{
    content:"";
    position: fixed;
    inset:0;
    pointer-events:none;
    background-image: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.012) 0px,
      rgba(255,255,255,0.012) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 2000;
    mix-blend-mode: overlay;
    opacity: 0.5;
  }
  [data-theme="sepia"] body::before{ display:none; }

  a{ color: inherit; }

  /* ---------- Top progress bar ---------- */
  #progress-track{
    position: fixed;
    top:0; left:0; right:0;
    height: 3px;
    background: transparent;
    z-index: 1000;
  }
  #progress-fill{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--cyan-dim), var(--cyan));
    box-shadow: 0 0 8px var(--cyan);
    transition: width 0.1s linear;
  }

  /* ---------- Top bar ---------- */
  #topbar{
    position: sticky;
    top: 3px;
    z-index: 900;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 20px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--panel-border);
  }
  #topbar .left{
    display:flex; align-items:center; gap:12px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    min-width:0;
  }
  #topbar .book-title{
    color: var(--text);
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }
  #topbar .sep{ color: var(--text-faint); }
  #menu-btn{
    display:none;
    background:none;
    border:1px solid var(--panel-border);
    color: var(--text);
    width:34px; height:34px;
    border-radius:6px;
    font-family: var(--mono);
    cursor:pointer;
    align-items:center;
    justify-content:center;
  }
  #controls{ display:flex; align-items:center; gap:8px; }
  .ctrl-btn{
    background: var(--panel);
    border:1px solid var(--panel-border);
    color: var(--text-dim);
    height: 34px;
    padding: 0 10px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 12px;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition: border-color 0.15s, color 0.15s;
  }
  .ctrl-btn:hover{ border-color: var(--cyan-dim); color: var(--text); }
  .ctrl-btn.active{ border-color: var(--cyan); color: var(--cyan); }
  #font-controls{ display:flex; align-items:center; border:1px solid var(--panel-border); border-radius:6px; overflow:hidden; }
  #font-controls button{
    background: var(--panel);
    border:none;
    color: var(--text-dim);
    width: 30px; height: 34px;
    cursor:pointer;
    font-family: var(--mono);
    font-size: 13px;
  }
  #font-controls button:hover{ color: var(--cyan); background: var(--bg-elevated); }
  #font-controls .divider{ width:1px; height:18px; background: var(--panel-border); }

  /* ---------- Layout ---------- */
  #app{
    display:flex;
    align-items: flex-start;
  }

  /* ---------- Sidebar rail ---------- */
  #rail{
    position: sticky;
    top: 51px;
    height: calc(100vh - 51px);
    width: var(--rail-w);
    flex-shrink:0;
    border-right: 1px solid var(--panel-border);
    overflow-y: auto;
    padding: 18px 0 40px;
  }
  #rail .rail-label{
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    padding: 0 22px 12px;
  }
  .chapter-nav-item{
    display:flex;
    gap: 14px;
    align-items: flex-start;
    padding: 14px 22px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background 0.15s, border-color 0.15s;
    position: relative;
  }
  .chapter-nav-item:hover{ background: var(--bg-elevated); }
  .chapter-nav-item.current{
    border-left-color: var(--cyan);
    background: var(--cyan-glow);
  }
  .chapter-nav-item .num{
    font-family: var(--mono);
    font-size: 20px;
    color: var(--text-faint);
    line-height: 1.1;
    min-width: 30px;
  }
  .chapter-nav-item.current .num{ color: var(--cyan); }
  .chapter-nav-item .meta{ min-width:0; }
  .chapter-nav-item .title{
    font-size: 14px;
    color: var(--text);
    line-height: 1.35;
    margin-bottom: 4px;
  }
  .chapter-nav-item .sub{
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
  }
  .chapter-nav-item .read-dot{
    position:absolute;
    right: 18px; top:18px;
    width:6px; height:6px;
    border-radius:50%;
    background: var(--cyan-dim);
    opacity: 0;
  }
  .chapter-nav-item.visited .read-dot{ opacity: 1; }

  #rail-backdrop{ display:none; }

  /* ---------- Reading pane ---------- */
  #reader{
    flex: 1;
    min-width: 0;
    display:flex;
    justify-content:center;
    padding: 56px 24px 140px;
  }
  #reader-inner{
    width: 100%;
    max-width: var(--max-w);
  }

  .chapter-header{
    margin-bottom: 42px;
  }
  .chapter-header .eyebrow{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--cyan);
    letter-spacing: 0.04em;
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .chapter-header .eyebrow .rule{
    height:1px; width: 28px; background: var(--cyan-dim);
  }
  .chapter-header h1{
    font-family: var(--serif);
    font-weight: 600;
    font-size: 34px;
    line-height: 1.18;
    margin: 0 0 12px;
    color: var(--text);
  }
  .chapter-header .read-time{
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-faint);
  }

  .prose{ font-size: var(--reader-size, 18px); line-height: 1.75; }
  .prose p{
    margin: 0 0 1.35em;
    color: var(--text);
    letter-spacing: 0.001em;
  }
  .prose p:first-of-type::first-letter{
    font-family: var(--serif);
    float:left;
    font-size: 3.4em;
    line-height: 0.85;
    padding-right: 10px;
    padding-top: 4px;
    font-weight: 600;
    color: var(--cyan);
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    margin: 2.4em 0;
    color: var(--text-faint);
  }
  .divider .diamond{
    width: 5px; height:5px;
    background: var(--cyan-dim);
    transform: rotate(45deg);
  }

  .system-block{
    font-family: var(--mono);
    font-size: 0.76em;
    line-height: 1.65;
    background: var(--bg-elevated);
    border: 1px solid var(--cyan-dim);
    border-radius: 4px;
    padding: 20px 22px;
    margin: 1.8em 0;
    color: var(--text-dim);
    box-shadow: 0 0 0 1px rgba(79,214,232,0.05), 0 0 26px -8px var(--cyan);
    white-space: pre-wrap;
  }
  .system-block .sys-head{
    color: var(--cyan);
    font-weight: 600;
    display:block;
    margin-bottom: 10px;
    letter-spacing: 0.02em;
  }

  .notify-block{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 0.72em;
    color: var(--gold);
    background: var(--gold-glow);
    border: 1px solid rgba(217,169,79,0.35);
    border-radius: 4px;
    padding: 10px 14px;
    margin: 0.3em 0 1.6em;
    width: 100%;
  }


  /* ---------- Chapter images ---------- */
  .chapter-image{
    margin: 2em 0;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--panel-border);
    background: var(--bg-elevated);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  }
  .chapter-image img{
    display: block;
    width: 100%;
    height: auto;
    vertical-align: middle;
  }
  .chapter-image .caption{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    padding: 10px 14px;
    border-top: 1px solid var(--panel-border);
    letter-spacing: 0.02em;
  }

  /* ---------- Chapter nav footer ---------- */
  #chapter-footer{
    display:flex;
    justify-content: space-between;
    gap: 16px;
    margin-top: 60px;
    padding-top: 28px;
    border-top: 1px solid var(--panel-border);
  }
  .foot-nav{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:6px;
    padding: 14px 16px;
    border:1px solid var(--panel-border);
    border-radius:6px;
    cursor:pointer;
    text-decoration:none;
    transition: border-color 0.15s, background 0.15s;
    min-width:0;
  }
  .foot-nav:hover{ border-color: var(--cyan-dim); background: var(--bg-elevated); }
  .foot-nav.next{ text-align:right; align-items:flex-end; }
  .foot-nav .label{
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
  }
  .foot-nav .cname{
    font-size: 14.5px;
    color: var(--text);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:100%;
  }
  .foot-nav.disabled{ opacity:0.35; pointer-events:none; }

  /* ---------- back to top ---------- */
  #top-btn{
    position: fixed;
    bottom: 26px;
    right: 26px;
    width: 42px; height:42px;
    border-radius:50%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--cyan);
    font-family: var(--mono);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.2s, border-color 0.15s;
    z-index: 500;
  }
  #top-btn.show{ opacity:1; pointer-events:auto; }
  #top-btn:hover{ border-color: var(--cyan); }

  /* ---------- Scrollbar ---------- */
  #rail::-webkit-scrollbar{ width:6px; }
  #rail::-webkit-scrollbar-thumb{ background: var(--panel-border); border-radius:3px; }

  @media (max-width: 860px){
    :root{ --rail-w: 260px; }
    #menu-btn{ display:flex; }
    #rail{
      position: fixed;
      top:0; left:0;
      height: 100vh;
      z-index: 1600;
      background: var(--bg);
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      padding-top: 60px;
    }
    #rail.open{ transform: translateX(0); }
    #rail-backdrop.open{
      display:block;
      position:fixed; inset:0;
      background: rgba(0,0,0,0.5);
      z-index: 1500;
    }
    .chapter-header h1{ font-size: 27px; }
    #reader{ padding: 40px 18px 120px; }
    #topbar .book-title{ max-width: 40vw; }
  }

  :focus-visible{ outline: 2px solid var(--cyan); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }
</style>
